name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - run: npm run check

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The version comes from the tag (v1.2.3 → 1.2.3), no version bump commits needed
      - name: Build
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: dotnet build host -c Release "-p:Version=$($env:TAG.TrimStart('v'))" -o dist/StreamDirector

      - name: Zip app folder
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: Compress-Archive -Path dist/StreamDirector -DestinationPath "dist/StreamDirector-$env:TAG-win.zip"

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges)
          else
            NOTES=$(git log --pretty=format:"- %s" --no-merges)
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: ${{ steps.notes.outputs.body }}
